<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05050b">
  <title>Coming Soon | Milana's Choice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,400&amp;family=Montserrat:wght@300;400;500&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #05050b;
      --ivory: #eee8d7;
      --muted: #c9bd9e;
      --gold: #e4b955;
      --gold-soft: rgba(228, 185, 85, .55);
      --line: rgba(228, 185, 85, .24);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ivory);
      background-color: var(--bg);
      background-image: url('/coming-soon-bg.png');
      background-position: center top;
      background-repeat: no-repeat;
      background-size: cover;
      font-family: 'Montserrat', sans-serif;
      font-weight: 300;
    }

    a { color: inherit; }

    .site-header {
      min-height: 112px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
    }

    .header-inner {
      width: min(1210px, calc(100% - 48px));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    .brand {
      color: #e2b85d;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(30px, 2.6vw, 43px);
      font-weight: 400;
      letter-spacing: .025em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: clamp(28px, 4vw, 58px);
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      color: #ded6c5;
      font-size: 16px;
      letter-spacing: .035em;
      text-decoration: none;
      transition: color .25s ease, text-shadow .25s ease;
    }

    .nav-links a:hover,
    .nav-links a:focus-visible {
      color: var(--gold);
      text-shadow: 0 0 18px rgba(228, 185, 85, .35);
    }

    .coming-soon {
      width: min(760px, calc(100% - 40px));
      min-height: calc(100vh - 112px);
      margin: 0 auto;
      padding: clamp(105px, 16vh, 165px) 0 72px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .eyebrow {
      margin: 0 0 30px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ivory);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(58px, 6.1vw, 82px);
      font-weight: 300;
      letter-spacing: .015em;
      line-height: .95;
    }

    .message {
      margin: 40px 0 0;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(20px, 2vw, 25px);
      line-height: 1.4;
    }

    .ornament {
      width: min(300px, 64vw);
      margin: 49px 0 52px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
      color: var(--gold);
    }

    .ornament::before,
    .ornament::after {
      content: '';
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold-soft));
    }

    .ornament::after { transform: scaleX(-1); }

    .stars {
      display: flex;
      gap: 13px;
      font-size: 17px;
      line-height: 1;
    }

    .actions {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 28px;
    }

    .button {
      min-height: 70px;
      border: 1px solid rgba(228, 185, 85, .78);
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #eac560;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .2em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background .25s ease, box-shadow .25s ease, transform .25s ease;
    }

    .button:hover,
    .button:focus-visible {
      background: rgba(228, 185, 85, .08);
      box-shadow: 0 0 28px rgba(228, 185, 85, .14);
      transform: translateY(-2px);
    }

    .thanks {
      margin: 80px 0 0;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-style: italic;
    }

    .closing-star {
      margin-top: 17px;
      color: var(--gold);
      font-size: 14px;
    }

    a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 5px;
    }

    @media (max-width: 760px) {
      body { background-position: center top; }

      .site-header { min-height: auto; }

      .header-inner {
        width: min(100% - 32px, 560px);
        padding: 24px 0 20px;
        flex-direction: column;
        gap: 20px;
      }

      .nav-links {
        width: 100%;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px 24px;
      }

      .nav-links a { font-size: 13px; }

      .coming-soon {
        min-height: auto;
        padding: 82px 0 58px;
      }

      .eyebrow { margin-bottom: 24px; }
      .message { margin-top: 32px; }
      .ornament { margin: 42px 0; }

      .actions {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .button { min-height: 62px; }
      .thanks { margin-top: 62px; }
    }

    @media (max-width: 420px) {
      .nav-links { gap: 11px 18px; }
      .nav-links a { font-size: 12px; }
      h1 { font-size: 52px; }
      .message br { display: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/">Milana’s Choice</a>
      <nav aria-label="Primary navigation">
        <ul class="nav-links">
          <li><a href="/professional">Professional</a></li>
          <li><a href="/creative">Creative</a></li>
          <li><a href="/esoteric">Esoteric</a></li>
          <li><a href="/about">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="coming-soon">
    <p class="eyebrow">Milana’s Choice</p>
    <h1>Coming Soon</h1>
    <p class="message">This page is being prepared with care.<br>New music, stories, and visual worlds will appear here soon.</p>

    <div class="ornament" aria-hidden="true">
      <span class="stars"><span>✦</span><span>✦</span></span>
    </div>

    <div class="actions">
      <a class="button" href="/creative">Back to Creative</a>
      <a class="button" href="/creative/music">Browse Music</a>
    </div>

    <p class="thanks">Thank you for visiting.</p>
    <span class="closing-star" aria-hidden="true">✦</span>
  </main>
</body>
</html>
